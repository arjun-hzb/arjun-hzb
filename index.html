<!DOCTYPE html>
<html>
<body>
    <h1>School Panel</h1>
    <textarea id="nums" placeholder="25 numbers yahan paste karo..."></textarea><br>
    <textarea id="msg" placeholder="Message yahan likho..."></textarea><br>
    <button onclick="send()">SEND MESSAGES</button>
    <script>
        async function send() {
            const data = { numbers: document.getElementById('nums').value, message: document.getElementById('msg').value };
            await fetch('/send', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert('Messages bhejna shuru ho gaya!');
        }
    </script>
</body>
</html>
